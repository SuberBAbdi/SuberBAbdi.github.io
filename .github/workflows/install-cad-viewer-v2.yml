name: Install CAD viewer v2 override

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install override
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'cad-viewer-v2.js' index.html; then
            echo 'CAD viewer v2 already installed.'
            exit 0
          fi
          printf '\n  <script src="cad-viewer-v2.js"></script>\n' >> index.html
          rm -f .github/workflows/install-cad-viewer-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/install-cad-viewer-v2.yml
          git commit -m 'fix: install Fusion-style CAD viewer v2'
          git push
