name: Apply CAD viewer navigation fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Inject CAD viewer fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="cad-viewer-fixes.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
              print('Injected CAD viewer fixes.')
          else:
              print('CAD viewer fixes already injected.')

      - name: Commit patched site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cad-viewer-fixes.js
          if git diff --cached --quiet; then
            echo "No CAD viewer changes to commit."
            exit 0
          fi
          git commit -m "fix: improve CAD viewer orbit and navigation arrows"
          git push
