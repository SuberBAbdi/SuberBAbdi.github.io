name: Repair Portfolio Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Apply navigation fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');

          const replaceOnce = (from, to, label) => {
            if (!html.includes(from)) throw new Error(`Could not find ${label}`);
            html = html.replace(from, to);
          };

          // Give the project-list button a stable id so Homelab can hide it
          // without accidentally affecting the Back to Portfolio control.
          replaceOnce(
            'button onclick="openAllProjectsModal()" class="focus-ring inline-flex items-center gap-2 font-mono text-xs uppercase tracking-wider text-dim hover:text-white transition-colors">\n              <i data-lucide="list" class="w-3.5 h-3.5"></i> Back to Project List',
            'button id="projectDetailBackProjectList" onclick="openAllProjectsModal()" class="focus-ring inline-flex items-center gap-2 font-mono text-xs uppercase tracking-wider text-dim hover:text-white transition-colors">\n              <i data-lucide="list" class="w-3.5 h-3.5"></i> Back to Project List',
            'project detail list button'
          );

          // The old global detailContent reference pointed at the original
          // #projectDetailContent node. closeProject() replaces the detail
          // shell with projectDetailTemplate, creating a NEW node. Re-read it
          // inside openProject() every time so project pages never render into
          // a detached DOM node on their second visit.
          replaceOnce(
            '  const detailContent = document.getElementById(\'projectDetailContent\');\n  // Immutable copy of the normal project-detail shell.',
            '  // #projectDetailContent is recreated whenever the detail shell is restored;\n  // openProject() therefore resolves it fresh for every navigation.\n  // Immutable copy of the normal project-detail shell.',
            'stale detailContent declaration'
          );

          replaceOnce(
            '    if (!document.getElementById(\'projectDetailContent\') && projectDetailTemplate) {\n      detailView.innerHTML = projectDetailTemplate;\n    }\n\n    // Cancel and clear every 3D viewer',
            '    if (!document.getElementById(\'projectDetailContent\') && projectDetailTemplate) {\n      detailView.innerHTML = projectDetailTemplate;\n    }\n    const detailContent = document.getElementById(\'projectDetailContent\');\n    if (!detailContent) return;\n\n    // Project pages can be opened after Homelab or after another project.\n    // Always restore the project-list control for real project pages.\n    const projectListBtn = document.getElementById(\'projectDetailBackProjectList\');\n    if (projectListBtn) projectListBtn.style.display = \'inline-flex\';\n\n    // Cancel and clear every 3D viewer',
            'fresh detailContent lookup in openProject'
          );

          // Homelab is not itself a project list page, so it should only have
          // Back to Portfolio. Hide the list control after restoring the normal
          // detail shell, before replacing the content with Homelab.
          replaceOnce(
            '  detailView.innerHTML = projectDetailTemplate;\n  const homelabContent = document.getElementById(\'projectDetailContent\');',
            '  detailView.innerHTML = projectDetailTemplate;\n  const homelabListBtn = document.getElementById(\'projectDetailBackProjectList\');\n  if (homelabListBtn) homelabListBtn.style.display = \'none\';\n  const homelabContent = document.getElementById(\'projectDetailContent\');',
            'Homelab project-list control'
          );

          // Make closing a detail page explicit: the detail shell must be
          // hidden again after its animation so its navigation can never leak
          // onto the main feed.
          replaceOnce(
            '      detailView.classList.remove(\'open\', \'closing\');\n      // Always restore the canonical project shell after leaving Homelab or a project.',
            '      detailView.classList.remove(\'open\', \'closing\');\n      detailView.style.display = \'none\';\n      // Always restore the canonical project shell after leaving Homelab or a project.',
            'explicit detail shell hide'
          );

          // The CSS currently forces margin-top:0!important on the career
          // timeline. Use an important inline value for the measured delta so
          // the divider is physically locked to the Experience divider.
          replaceOnce(
            '    timeline.style.marginTop = \'0px\';\n    const desiredTop = expHead.getBoundingClientRect().bottom;\n    const delta = desiredTop - timeline.getBoundingClientRect().top;\n    timeline.style.marginTop = delta + \'px\';',
            '    timeline.style.removeProperty(\'margin-top\');\n    const desiredTop = expHead.getBoundingClientRect().bottom;\n    const delta = desiredTop - timeline.getBoundingClientRect().top;\n    timeline.style.setProperty(\'margin-top\', delta + \'px\', \'important\');',
            'main career timeline alignment'
          );

          fs.writeFileSync(path, html);
          console.log('Applied portfolio navigation fixes.');
          NODE

      - name: Remove temporary repair workflow
        run: |
          rm -f .github/workflows/repair-portfolio-navigation.yml

      - name: Commit repaired portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-portfolio-navigation.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: repair project navigation and career timeline"
          git push
