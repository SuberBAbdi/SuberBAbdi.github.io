name: Restore CAD viewer baseline once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore CAD viewer from the requested stable version
        run: |
          git checkout fe2223826ec1780c4006a816b61a51b93cbaf1c0 -- js/cad-viewer.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cad-viewer.js
          git diff --cached --quiet && exit 0
          git commit -m "revert: restore stable CAD viewer version"
          git push
